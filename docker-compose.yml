services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT_EXTERNAL}:5432"

  web:
    build: .
    command: gunicorn core_project.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "${PORTA_WEB:-8005}:8000"
    env_file:
      - .env
    depends_on:
      - db
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # =========================================================
  # INFRAESTRUTURA ASSÍNCRONA (DESCOMENTE PARA USAR)
  # =========================================================
  redis:
    image: redis:7-alpine
    # ports:
    #  - "${PORTA_REDIS:-8004}:6379"

  celery:
    build: .
    command: celery -A core_project worker --loglevel=info --concurrency=2 --max-tasks-per-child=20 --max-memory-per-child=350000
    mem_limit: 1g
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"

  celery-beat:
    build: .
    command: celery -A core_project beat --loglevel=info
    mem_limit: 256m
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
