{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senha Alterada - The Fiber</title>
    <link rel="icon" type="image/png" href="{% static 'img/LOGO_THEFIBER_M1.png' %}">
    <!-- nosemgrep: html.security.audit.missing-integrity.missing-integrity -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'fiber-dark': '#00384d',
                        'fiber-light': '#29a9e1',
                        'fiber-green': '#47704c',
                        'fiber-purple': '#792980',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen">

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl overflow-hidden p-8 border border-slate-100 text-center mt-10">
    <div class="flex justify-center mb-6">
        <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center">
            <svg class="w-8 h-8 text-fiber-green" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
        </div>
    </div>

    <h2 class="text-2xl font-bold text-fiber-dark mb-2">Senha Atualizada!</h2>
    <p class="text-slate-500 mb-8 text-sm">Sua senha foi alterada com sucesso. A partir do próximo login você deverá usar a nova senha.</p>

    <a href="{% url 'dashboard_operacoes' %}" 
       class="w-full inline-block bg-fiber-dark text-white font-bold py-3 rounded-lg hover:bg-opacity-90 hover:shadow-lg transition-all">
        Voltar para o Painel
    </a>
</div>
{% endblock %}

</body>
</html>
