{% extends "base_auth.html" %}
{% load static %}

{% block title %}Senha Alterada - The Fiber{% endblock %}

{% block content %}
<div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden p-8 border border-slate-100 text-center">
    <div class="flex justify-center mb-6">
        <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center">
            <svg class="w-8 h-8 text-fiber-green" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
        </div>
    </div>

    <h2 class="text-2xl font-bold text-fiber-dark mb-2">Senha Alterada com Sucesso!</h2>
    <p class="text-slate-500 mb-8 text-sm">A sua senha foi redefinida. Você já pode acessar o painel com as novas credenciais.</p>

    <a href="{% url 'login' %}" 
       class="w-full inline-block bg-fiber-dark text-white font-bold py-3 rounded-lg hover:bg-opacity-90 hover:shadow-lg transition-all">
        Fazer Login Agora
    </a>
</div>
{% endblock %}
