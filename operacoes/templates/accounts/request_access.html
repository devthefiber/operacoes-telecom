{% extends "base_auth.html" %}
{% load static %}

{% block title %}Solicitar Acesso - The Fiber{% endblock %}

{% block content %}
<div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden p-8 border border-slate-100">
    <!-- Logo -->
    <div class="flex justify-center mb-6">
        <img src="{% static 'img/LOGO_THEFIBER_M1.png' %}" alt="The Fiber Logo" class="h-12 object-contain">
    </div>

    <h2 class="text-2xl font-bold text-center text-fiber-dark mb-2">Solicitar Acesso</h2>
    <p class="text-center text-slate-500 mb-8 text-sm">Preencha seus dados para requisitar um perfil no painel comercial.</p>

    <!-- Formulário -->
    <form method="POST" action="{% url 'request_access' %}">
        {% csrf_token %}
        
        <div class="mb-4">
            <label for="name" class="block text-sm font-medium text-slate-700 mb-1">Nome Completo</label>
            <input type="text" name="name" id="name" required placeholder="João da Silva"
                   class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-fiber-light focus:border-transparent transition-all">
        </div>

        <div class="mb-4">
            <label for="email" class="block text-sm font-medium text-slate-700 mb-1">E-mail Corporativo</label>
            <input type="email" name="email" id="email" required placeholder="joao@thefiber.com.br"
                   class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-fiber-light focus:border-transparent transition-all">
        </div>

        <div class="mb-8">
            <label for="department" class="block text-sm font-medium text-slate-700 mb-1">Setor / Cargo</label>
            <input type="text" name="department" id="department" required placeholder="Comercial / Analista"
                   class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-fiber-light focus:border-transparent transition-all">
        </div>

        <button type="submit" 
                class="w-full bg-fiber-light text-white font-bold py-3 rounded-lg hover:bg-fiber-dark hover:shadow-lg transition-all transform hover:-translate-y-0.5">
            Enviar Solicitação
        </button>
    </form>

    <div class="mt-6 text-center">
        <a href="{% url 'login' %}" class="text-sm font-semibold text-slate-500 hover:text-fiber-dark transition-colors">
            &larr; Voltar para o Login
        </a>
    </div>
</div>
{% endblock %}
