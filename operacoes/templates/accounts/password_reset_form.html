{% extends "base_auth.html" %}
{% load static %}

{% block title %}Esqueci minha Senha - The Fiber{% endblock %}

{% block content %}
<div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden p-8 border border-slate-100">
    <div class="flex justify-center mb-6">
        <img src="{% static 'img/LOGO_THEFIBER_M1.png' %}" alt="The Fiber Logo" class="h-12 object-contain">
    </div>

    <h2 class="text-2xl font-bold text-center text-fiber-dark mb-2">Recuperar Senha</h2>
    <p class="text-center text-slate-500 mb-8 text-sm">Digite seu e-mail corporativo. Enviaremos um link para você recriar sua senha.</p>

    <!-- nosemgrep: python.django.security.django-no-csrf-token.django-no-csrf-token -->
    <form method="post" action="">
        {% csrf_token %}
        <div class="mb-6">
            <label for="email" class="block text-sm font-medium text-slate-700 mb-1">E-mail</label>
            <input type="email" name="email" id="email" required placeholder="seunome@thefiber.com.br"
                   class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-fiber-light focus:border-transparent transition-all">
        </div>

        <button type="submit" 
                class="w-full bg-fiber-dark text-white font-bold py-3 rounded-lg hover:bg-opacity-90 hover:shadow-lg transition-all transform hover:-translate-y-0.5">
            Enviar Link de Recuperação
        </button>
    </form>

    <div class="mt-6 text-center">
        <a href="{% url 'login' %}" class="text-sm font-semibold text-slate-500 hover:text-fiber-dark transition-colors">
            &larr; Voltar para o Login
        </a>
    </div>
</div>
{% endblock %}
