{% extends "base_auth.html" %}
{% load static %}

{% block title %}Login - The Fiber{% endblock %}

{% block content %}
<div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden p-8 border border-slate-100">
    <!-- Logo -->
    <div class="flex justify-center mb-8">
        <img src="{% static 'img/LOGO_THEFIBER_M1.png' %}" alt="The Fiber Logo" class="h-16 object-contain">
    </div>

    <h2 class="text-2xl font-bold text-center text-fiber-dark mb-2">Painel Comercial</h2>
    <p class="text-center text-slate-500 mb-8 text-sm">Insira suas credenciais para acessar os dados.</p>

    <!-- Formulário -->
    <form method="POST" action="{% url 'login' %}" onsubmit="document.getElementById('btn-submit').disabled = true; document.getElementById('btn-submit').innerText = 'Entrando...';">
        {% csrf_token %}
        
        <div class="mb-5">
            <label for="username" class="block text-sm font-medium text-slate-700 mb-1">Usuário / E-mail</label>
            <input type="text" name="username" id="username" required 
                   class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-fiber-light focus:border-transparent transition-all">
        </div>

        <div class="mb-6">
            <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Senha</label>
            <div class="relative">
                <input type="password" name="password" id="password" required 
                       class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-fiber-light focus:border-transparent transition-all pr-12">
                <button type="button" onclick="togglePassword('password', this)" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-fiber-light">
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    </svg>
                </button>
            </div>
            
            <div class="flex justify-between items-center mt-2">
                <a href="{% url 'password_reset' %}" class="text-xs font-semibold text-fiber-light hover:text-fiber-dark transition-colors">Esqueci minha senha</a>
            </div>
        </div>

        <button type="submit" id="btn-submit"
                class="w-full bg-fiber-dark text-white font-bold py-3 rounded-lg hover:bg-opacity-90 hover:shadow-lg transition-all transform hover:-translate-y-0.5">
            Entrar no Painel
        </button>
    </form>

    <!-- Link Solicitar Acesso -->
    <div class="mt-8 pt-6 border-t border-slate-100 text-center">
        <p class="text-sm text-slate-600">Não tem uma conta?</p>
        <a href="{% url 'request_access' %}" class="inline-block mt-2 font-bold text-fiber-dark hover:text-fiber-light transition-colors border-b-2 border-transparent hover:border-fiber-light">
            Solicitar Acesso ao Sistema
        </a>
    </div>
</div>
{% endblock %}
